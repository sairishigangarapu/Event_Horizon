name: Test and deploy to Railway
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.runtime.txt
            requirements.railway.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.1,<3'
          python -m pip install -r requirements.railway.txt 'pytest>=8,<10'
      - name: Main backend tests
        # This deployment uses the plain HTML runtime dashboard, not legacy Streamlit.
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/test_dashboard_app.py
      - name: Person 4 integration contracts
        run: python -m pytest person4/tests -q -p no:cacheprovider
      - name: Studio Python contracts
        working-directory: studio
        run: python -m unittest test_observations test_backend
      - name: Studio frontend and ordered transport contracts
        working-directory: studio
        run: |
          node test_engine.js
          node test_regressions.js
          node test_ui.js
          node test_live.js
      - name: Two-service roundtrip
        run: python verify_roundtrip.py
      - name: Railway single-port roundtrip
        run: python verify_hosted.py
      - name: Build Railway image
        run: docker build --tag event-horizon:${{ github.sha }} .
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RAILWAY_PROJECT_ID != '' && vars.RAILWAY_SERVICE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy tested source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo 'Set the environment-scoped RAILWAY_TOKEN GitHub secret.'; exit 1; }
          railway up --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE_ID" --ci
