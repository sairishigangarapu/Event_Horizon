name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.integration.txt
      - name: Run main test suite
        run: pytest tests -q --ignore=tests/test_dashboard_app.py --disable-warnings
      - name: Run person4 test suite
        run: pytest person4/tests -q --disable-warnings

  studio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run studio JS tests
        working-directory: studio
        run: |
          node test_engine.js
          node test_regressions.js
          node test_ui.js
          node test_live.js
