name: Integration checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.runtime.txt
            requirements.railway.txt
            requirements.integration.txt
            requirements.txt
            deploy/twin_studio/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.1,<3'
          python -m pip install -r requirements.integration.txt
      - name: Main backend tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Person 4 integration contracts
        run: python -m pytest person4/tests -q -p no:cacheprovider
      - name: Studio Python contracts
        working-directory: studio
        run: python -m unittest test_observations test_backend
      - name: Studio frontend and ordered transport contracts
        working-directory: studio
        run: |
          node test_engine.js
          node test_regressions.js
          node test_ui.js
          node test_live.js
      - name: Two-service roundtrip
        run: python verify_roundtrip.py
      - name: Railway single-port roundtrip
        run: python verify_hosted.py
      - name: Authenticated random-flow frontend integration
        run: python verify_random_flow.py
      - name: Build Railway image
        run: docker build --tag event-horizon:${{ github.sha }} .